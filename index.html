<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VASO.GEN — Post-Modern</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    background:#0a0a0a; color:#f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow:hidden; height:100vh; height:100dvh;
  }
  #canvasWrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }
  canvas { display:block; touch-action:none; }

  header {
    position:fixed; top:0; left:0; right:0;
    padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:100; pointer-events:none;
  }
  .logo { font-weight:900; font-size:18px; letter-spacing:-1px; }
  .logo span { color:#ff3d00; }
  .tag { font-size:9px; letter-spacing:2px; opacity:0.5; }

  .panel {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(15,15,15,0.96);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,0.08);
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    z-index:50;
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    max-height:80vh; overflow-y:auto;
  }
  .panel.collapsed { transform: translateY(calc(100% - 48px)); }
  .panel-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; position:sticky; top:0;
  }
  .panel-title { font-weight:900; font-size:12px; letter-spacing:0.5px; }
  .panel-title span { color:#ff3d00; }
  .toggle-btn {
    width:32px; height:32px; border-radius:50%;
    background:#ff3d00; border:none; color:#000;
    font-size:13px; font-weight:700; cursor:pointer;
  }
  .panel.collapsed .toggle-btn { transform:rotate(180deg); }

  .styles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }
  .style-btn {
    background: #111;
    border: 1px solid #333;
    color: #888;
    padding: 8px 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .style-btn.active { background: #ff3d00; border-color: #ff3d00; color: #000; }

  .sliders { display:flex; flex-direction:column; gap:12px; }
  .row { display:grid; grid-template-columns:80px 1fr 40px; align-items:center; gap:8px; }
  .lbl { font-size:9px; letter-spacing:1.2px; text-transform:uppercase; opacity:0.6; }
  .val { font-size:10px; text-align:right; color:#00ff9d; font-variant-numeric:tabular-nums; }

  .texture-row {
    display: flex; gap: 6px; margin-top: 4px; margin-bottom: 8px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .tex-btn {
    background: #111; border: 1px solid #333; color: #888;
    padding: 6px 12px; font-size: 9px; border-radius: 20px;
    white-space: nowrap; cursor: pointer; transition: all 0.2s;
  }
  .tex-btn.active { background: #00ff9d; border-color: #00ff9d; color: #000; }

  input[type=range] {
    -webkit-appearance:none; appearance:none; width:100%; height:2px;
    background:#333; border-radius:2px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#f0f0f0; border:3px solid #0a0a0a;
    box-shadow:0 0 0 1px #f0f0f0; cursor:pointer;
  }

  .actions {
    display:flex; gap:8px; margin-top:16px;
    padding-top:16px; border-top:1px solid rgba(255,255,255,0.08);
  }
  .btn {
    flex:1; padding:12px 8px; border:none;
    font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:1px; cursor:pointer; transition:all 0.15s;
  }
  .btn:active { transform:scale(0.97); }
  .btn-primary { background:#ff3d00; color:#000; }
  .btn-secondary { background:transparent; color:#f0f0f0; border:1px solid rgba(255,255,255,0.15); }

  .info {
    position:fixed; top:60px; left:16px;
    font-size:9px; letter-spacing:2px; opacity:0.4;
    pointer-events:none; z-index:5;
  }
  @media (min-width:900px) {
    .panel { left:auto; right:20px; bottom:20px; width:380px; max-height:none; }
    .info { top:80px; }
  }

  .modal {
    position:fixed; inset:0; background:rgba(5,5,5,0.98); /* Arka plan tamamen kapatıldı */
    z-index:200;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .modal.open { opacity:1; pointer-events:auto; }
  .modal-header {
    padding:14px 16px; display:flex; justify-content:space-between;
    align-items:center; border-bottom:1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .modal-title { font-weight:900; font-size:13px; }
  .modal-title span { color:#00ff9d; }
  .modal-sub { font-size:8px; letter-spacing:2px; opacity:0.5; margin-top:2px; }
  .close-btn {
    width:36px; height:36px; border-radius:50%; background:transparent;
    border:1px solid rgba(255,255,255,0.2); color:#f0f0f0;
    font-size:16px; cursor:pointer;
  }
  #previewWrap { 
    flex:1; 
    position:relative; 
    touch-action:none; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    overflow: hidden;
  }
  .modal-footer {
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:8px; border-top:1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo">VASO<span>·</span>GEN</div>
  <div class="tag">POST-MODERN v2.2</div>
</header>

<div id="canvasWrap"></div>
<div class="info" id="info">VERTEX: —</div>

<div class="panel" id="panel">
  <div class="panel-header" id="handle">
    <div class="panel-title">TASARIM <span>LABORATUVARI</span></div>
    <button class="toggle-btn">▲</button>
  </div>

  <div class="styles">
    <button class="style-btn active" onclick="applyStyle('classic', this)">Klasik</button>
    <button class="style-btn" onclick="applyStyle('brutalist', this)">Brütal</button>
    <button class="style-btn" onclick="applyStyle('organic', this)">Organik</button>
    <button class="style-btn" onclick="applyStyle('cyber', this)">Cyber</button>
  </div>

  <div class="texture-row">
    <button class="tex-btn active" onclick="setTexture('smooth', this)">Düz</button>
    <button class="tex-btn" onclick="setTexture('ripple', this)">Kabarcık</button>
    <button class="tex-btn" onclick="setTexture('lattice', this)">Kafes</button>
    <button class="tex-btn" onclick="setTexture('stripe', this)">Çizgili</button>
    <button class="tex-btn" onclick="setTexture('checker', this)">Kareli</button>
  </div>

  <div class="sliders">
    <div class="row"><div class="lbl">Yükseklik</div><input type="range" id="height" min="60" max="220" value="120"><div class="val" id="heightVal">120</div></div>
    <div class="row"><div class="lbl">Taban</div><input type="range" id="baseR" min="10" max="70" value="30"><div class="val" id="baseRVal">30</div></div>
    <div class="row"><div class="lbl">Boyun</div><input type="range" id="neckR" min="5" max="60" value="22"><div class="val" id="neckRVal">22</div></div>
    <div class="row"><div class="lbl">Şişkinlik</div><input type="range" id="bulge" min="0" max="80" value="25"><div class="val" id="bulgeVal">25</div></div>
    <div class="row"><div class="lbl">Büküm</div><input type="range" id="twist" min="0" max="10" value="0" step="0.5"><div class="val" id="twistVal">0</div></div>
    <div class="row"><div class="lbl">Dalga</div><input type="range" id="wave" min="0" max="15" value="0" step="1"><div class="val" id="waveVal">0</div></div>
    <div class="row"><div class="lbl">Segment</div><input type="range" id="segments" min="3" max="16" value="4" step="1"><div class="val" id="segmentsVal">4</div></div>
    <div class="row"><div class="lbl">Doku Şiddeti</div><input type="range" id="texIntensity" min="0" max="100" value="40"><div class="val" id="texIntensityVal">40</div></div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="previewBtn">👁 ÖNİZLE</button>
    <button class="btn btn-primary" id="exportBtn">↓ STL İNDİR</button>
  </div>
</div>

<div class="modal" id="previewModal">
  <div class="modal-header">
    <div>
      <div class="modal-title">STL <span>ÖNİZLEME</span></div>
      <div class="modal-sub" id="previewSub">HAZIRLANIYOR...</div>
    </div>
    <button class="close-btn" id="closePreview">✕</button>
  </div>
  <div id="previewWrap"></div>
  <div class="modal-footer">
    <button class="btn btn-secondary" id="closePreview2">KAPAT</button>
    <button class="btn btn-primary" id="exportFromPreview">↓ İNDİR</button>
  </div>
</div>

<script>
'use strict';

const params = {
  height: 120, baseR: 30, neckR: 22, bulge: 25,
  twist: 0, wave: 0, segments: 4,
  texIntensity: 40,
  texture: 'smooth',
  radialSegments: 40, 
  heightSegments: 50,
};

function getProfileRadius(t) {
  const { baseR, neckR, bulge } = params;
  const baseCurve = baseR * (1 - t) + neckR * t;
  const bulgeCurve = Math.sin(t * Math.PI) * bulge;
  const taper = Math.pow(1 - t, 0.15) * 0.15 + 0.85;
  return (baseCurve + bulgeCurve) * taper;
}

function getTextureOffset(u, t, theta) {
  const intensity = params.texIntensity / 100;
  if (intensity === 0) return 0;
  
  let offset = 0;
  switch(params.texture) {
    case 'ripple':
      offset = Math.sin(t * 30) * Math.cos(theta * 8) * intensity * 15;
      break;
    case 'lattice':
      const gridU = Math.abs(Math.sin(theta * 12));
      const gridV = Math.abs(Math.sin(t * 20));
      offset = (gridU * gridV) * intensity * 20 - (intensity * 10);
      break;
    case 'stripe':
      offset = Math.sin(t * 50) * intensity * 10;
      break;
    case 'checker':
      const checkU = Math.floor(theta / (Math.PI/6)) % 2;
      const checkV = Math.floor(t * 15) % 2;
      offset = (checkU === checkV ? 1 : -1) * intensity * 12;
      break;
    default:
      offset = 0;
  }
  return offset;
}

function buildMesh() {
  const { height, twist, wave, segments, radialSegments, heightSegments } = params;
  const verts = [];
  const faces = [];

  for (let iy = 0; iy <= heightSegments; iy++) {
    const t = iy / heightSegments;
    const y = t * height;
    const rBase = getProfileRadius(t);
    const segFactor = segments;
    const waveAmp = wave * 0.01 * rBase;

    for (let ix = 0; ix <= radialSegments; ix++) {
      const u = ix / radialSegments;
      const theta = u * Math.PI * 2;
      
      const lob = Math.cos(theta * segFactor);
      const lobMix = 0.5 + 0.5 * lob;
      const smoothLob = Math.pow(lobMix, 0.6);
      const segInf = Math.min((segFactor - 3) / 13, 1) * 0.4;
      const rSeg = rBase * (1 - segInf + segInf * (0.5 + 1.0 * smoothLob));
      
      const twistAngle = twist * 0.1 * t;
      const waveOff = Math.sin(t * Math.PI * 6 + theta * 3) * waveAmp;
      
      const texOff = getTextureOffset(u, t, theta);

      const r = rSeg + waveOff + texOff;
      const x = r * Math.cos(theta + twistAngle);
      const z = r * Math.sin(theta + twistAngle);
      
      verts.push({ x, y, z });
    }
  }

  const rowLen = radialSegments + 1;
  for (let iy = 0; iy < heightSegments; iy++) {
    for (let ix = 0; ix < radialSegments; ix++) {
      const a = iy * rowLen + ix;
      const b = a + 1;
      const c = a + rowLen;
      const d = c + 1;
      faces.push([a, c, b]);
      faces.push([b, c, d]);
    }
  }

  const bottomCenter = verts.length;
  verts.push({ x: 0, y: 0, z: 0 });
  for (let ix = 0; ix < radialSegments; ix++) faces.push([bottomCenter, ix + 1, ix]);

  const topStart = heightSegments * rowLen;
  const topCenter = verts.length;
  verts.push({ x: 0, y: height, z: 0 });
  for (let ix = 0; ix < radialSegments; ix++) faces.push([topCenter, topStart + ix, topStart + ix + 1]);

  return { verts, faces };
}

class Renderer {
  constructor(container) {
    this.container = container;
    this.canvas = document.createElement('canvas');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    container.appendChild(this.canvas);
    
    this.rotX = 0.2;
    this.rotY = 0.6;
    this.zoom = 1;
    
    this.dragging = false;
    this.lastX = 0; this.lastY = 0;
    this.autoRotate = true;
    this.needsRender = true;

    this.bindEvents();
    this.mesh = null;
    this.resize();
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    
    // EKRAN BOYUTUNU PENCEREYE SABİTLİYORUZ (Böylece hep dolu görünür)
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    
    this.canvas.width = this.w * dpr;
    this.canvas.height = this.h * dpr;
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    
    // Canvas'ı ortala
    this.canvas.style.position = 'absolute';
    this.canvas.style.top = '50%';
    this.canvas.style.left = '50%';
    this.canvas.style.transform = 'translate(-50%, -50%)';
    this.canvas.style.maxWidth = '100%';
    this.canvas.style.maxHeight = '100%';

    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.needsRender = true;
  }

  bindEvents() {
    const c = this.canvas;
    const onStart = (x, y) => {
      this.dragging = true;
      this.lastX = x; this.lastY = y;
      this.autoRotate = false;
    };
    const onMove = (x, y) => {
      if (!this.dragging) return;
      this.rotY += (x - this.lastX) * 0.01;
      this.rotX += (y - this.lastY) * 0.01;
      this.rotX = Math.max(-1.4, Math.min(1.4, this.rotX));
      this.lastX = x; this.lastY = y;
      this.needsRender = true;
    };
    const onEnd = () => {
      this.dragging = false;
      setTimeout(() => { this.autoRotate = true; this.needsRender = true; }, 2000);
    };

    c.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onEnd);

    c.addEventListener('touchstart', e => {
      if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
      else if (e.touches.length === 2) {
        this.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
    }, { passive: true });

    c.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
      else if (e.touches.length === 2 && this.pinchDist) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        this.zoom *= d / this.pinchDist;
        this.zoom = Math.max(0.4, Math.min(2.5, this.zoom));
        this.pinchDist = d;
        this.needsRender = true;
      }
    }, { passive: false });

    c.addEventListener('touchend', () => { onEnd(); this.pinchDist = null; }, { passive: true });
  }

  setMesh(mesh) { this.mesh = mesh; this.needsRender = true; }

  project(p) {
    const cy = Math.cos(this.rotY), sy = Math.sin(this.rotY);
    const cx = Math.cos(this.rotX), sx = Math.sin(this.rotX);
    const py = p.y - (params.height * 0.5);
    
    const x1 = p.x * cy + p.z * sy;
    const z1 = -p.x * sy + p.z * cy;
    const y1 = py;
    const y2 = y1 * cx - z1 * sx;
    const z2 = y1 * sx + z1 * cx;
    
    const camDist = 450;
    const z = z2 + camDist;
    if (z < 1) return null;
    
    const scale = (400 / z) * this.zoom;
    return { x: this.w / 2 + x1 * scale, y: this.h / 2 - y2 * scale, z: z2 };
  }

  render() {
    if (!this.needsRender && !this.autoRotate) return;
    if (this.autoRotate && !this.dragging) this.rotY += 0.006;

    const ctx = this.ctx;
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, this.w, this.h);

    if (!this.mesh) return;

    const { verts, faces } = this.mesh;
    const projected = verts.map(v => this.project(v));
    const faceData = [];

    for (let i = 0; i < faces.length; i++) {
      const face = faces[i];
      const p0 = projected[face[0]], p1 = projected[face[1]], p2 = projected[face[2]];
      if (!p0 || !p1 || !p2) continue;

      const avgZ = (p0.z + p1.z + p2.z) / 3;
      const v0 = verts[face[0]], v1 = verts[face[1]], v2 = verts[face[2]];
      const ax = v1.x - v0.x, ay = v1.y - v0.y, az = v1.z - v0.z;
      const bx = v2.x - v0.x, by = v2.y - v0.y, bz = v2.z - v0.z;
      const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      const nlen = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;

      const lx = 0.5, ly = 0.8, lz = 0.6;
      const dot = (nx * lx + ny * ly + nz * lz) / nlen;
      
      let shade = 0.1 + Math.max(0, dot) * 0.9;
      if (shade > 1) shade = 1;

      faceData.push({ p0, p1, p2, z: avgZ, shade });
    }

    faceData.sort((a, b) => b.z - a.z);

    for (let i = 0; i < faceData.length; i++) {
      const f = faceData[i];
      const s = f.shade;
      
      const r = Math.round(235 * s);
      const g = Math.round(230 * s);
      const b = Math.round(220 * s);
      
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.strokeStyle = `rgba(0,0,0,${0.1 * s})`;
      ctx.lineWidth = 0.5;
      
      ctx.beginPath();
      ctx.moveTo(f.p0.x, f.p0.y);
      ctx.lineTo(f.p1.x, f.p1.y);
      ctx.lineTo(f.p2.x, f.p2.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    this.needsRender = false;
  }
}

function exportSTL(mesh, filename) {
  const { verts, faces } = mesh;
  const lines = ['solid vase'];
  for (const [i0, i1, i2] of faces) {
    const v0 = verts[i0], v1 = verts[i1], v2 = verts[i2];
    const ax = v1.x-v0.x, ay = v1.y-v0.y, az = v1.z-v0.z;
    const bx = v2.x-v0.x, by = v2.y-v0.y, bz = v2.z-v0.z;
    let nx = ay*bz - az*by, ny = az*bx - ax*bz, nz = ax*by - ay*bx;
    const len = Math.hypot(nx, ny, nz) || 1;
    nx/=len; ny/=len; nz/=len;
    lines.push(`  facet normal ${nx.toFixed(4)} ${ny.toFixed(4)} ${nz.toFixed(4)}`);
    lines.push(`    outer loop`);
    lines.push(`      vertex ${v0.x.toFixed(3)} ${v0.y.toFixed(3)} ${v0.z.toFixed(3)}`);
    lines.push(`      vertex ${v1.x.toFixed(3)} ${v1.y.toFixed(3)} ${v1.z.toFixed(3)}`);
    lines.push(`      vertex ${v2.x.toFixed(3)} ${v2.y.toFixed(3)} ${v2.z.toFixed(3)}`);
    lines.push(`    endloop`);
    lines.push(`  endfacet`);
  }
  lines.push('endsolid vase');

  const blob = new Blob([lines.join('\n')], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const mainRenderer = new Renderer(document.getElementById('canvasWrap'));
let currentMesh = null;

function rebuild() {
  currentMesh = buildMesh();
  mainRenderer.setMesh(currentMesh);
  document.getElementById('info').textContent = `VERTEX: ${currentMesh.verts.length}`;
}

function applyStyle(style, btn) {
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  let np = {};
  if (style === 'classic') {
    np = { height:120, baseR:30, neckR:22, bulge:25, twist:0, wave:0, segments:4 };
  } else if (style === 'brutalist') {
    np = { height:160, baseR:55, neckR:50, bulge:10, twist:0, wave:0, segments:6 };
  } else if (style === 'organic') {
    np = { height:180, baseR:20, neckR:15, bulge:50, twist:4, wave:8, segments:4 };
  } else if (style === 'cyber') {
    np = { height:140, baseR:45, neckR:25, bulge:0, twist:2, wave:0, segments:12 };
  }

  Object.entries(np).forEach(([k, v]) => {
    params[k] = v;
    document.getElementById(k).value = v;
    document.getElementById(k + 'Val').textContent = v;
  });
  rebuild();
}

function setTexture(type, btn) {
  document.querySelectorAll('.tex-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  params.texture = type;
  rebuild();
}

const sliderMap = {
  height:'heightVal', baseR:'baseRVal', neckR:'neckRVal',
  bulge:'bulgeVal', twist:'twistVal', wave:'waveVal', 
  segments:'segmentsVal', texIntensity:'texIntensityVal'
};

Object.entries(sliderMap).forEach(([k, valId]) => {
  const input = document.getElementById(k);
  const label = document.getElementById(valId);
  input.addEventListener('input', e => {
    params[k] = parseFloat(e.target.value);
    label.textContent = e.target.value;
    rebuild();
  });
  if(input.value) {
     params[k] = parseFloat(input.value);
     label.textContent = input.value;
  }
});

document.getElementById('handle').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('collapsed');
  setTimeout(() => mainRenderer.resize(), 400);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if (!currentMesh) return;
  exportSTL(currentMesh, `vaso-${Date.now()}.stl`);
  const btn = document.getElementById('exportBtn');
  const orig = btn.textContent;
  btn.textContent = '✓ İNDİ';
  setTimeout(() => btn.textContent = orig, 1200);
});

// MODAL ÖNİZLEME
let previewRenderer = null;
let previewMesh = null;

function openPreview() {
  const modal = document.getElementById('previewModal');
  modal.classList.add('open');
  
  // Ekran boyutları otursun diye çok kısa bir bekleme
  setTimeout(() => {
    const wrap = document.getElementById('previewWrap');
    
    if (!previewRenderer) {
      previewRenderer = new Renderer(wrap);
    }
    
    // Ekran boyutunu tekrar al
    previewRenderer.resize();

    previewMesh = buildMesh();
    previewRenderer.setMesh(previewMesh);
    previewRenderer.autoRotate = true;
    
    document.getElementById('previewSub').textContent = `${previewMesh.verts.length} VERTEX`;
  }, 150); 
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('open');
}

document.getElementById('previewBtn').addEventListener('click', openPreview);
document.getElementById('closePreview').addEventListener('click', closePreview);
document.getElementById('closePreview2').addEventListener('click', closePreview);
document.getElementById('exportFromPreview').addEventListener('click', () => {
  if (previewMesh) exportSTL(previewMesh, `vaso-${Date.now()}.stl`);
});

window.addEventListener('resize', () => {
  mainRenderer.resize();
  if (previewRenderer) previewRenderer.resize();
});

function loop() {
  mainRenderer.render();
  if (previewRenderer) previewRenderer.render();
  requestAnimationFrame(loop);
}

rebuild();
loop();
</script>
</body>
</html>
